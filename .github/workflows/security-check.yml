# Weekly security check for the Yield Predictor: installs the app the way the server does, then pip-audit (from the
# Python Packaging Authority) looks up every library it uses in the public list of known security holes.
# If it finds one, this run fails and GitHub emails you. The fix is usually a redeploy (the server then installs
# the newest versions), or raising that library's minimum version. Run it any time from the Actions tab
# ("Security check" > "Run workflow"). Why not Dependabot for this: it can't read pyproject.toml dependency lists.

name: Security check

on:
  schedule:
    - cron: "49 12 * * 1"          # Mondays, just after 12:40 UTC (early morning in Colorado)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the app as the server does
        run: |
          python -m venv app
          app/bin/pip install --quiet --upgrade pip     # the installer itself isn't the app; keep it current
          app/bin/pip install --quiet -r requirements.txt       # what Streamlit Cloud installs
      - name: Look up every library it uses
        run: |
          python -m pip install --quiet pip-audit
          PIPAPI_PYTHON_LOCATION=app/bin/python pip-audit --progress-spinner off --skip-editable
